<!doctype html>
<html>
	<head>
		<title>Factorial Program</title>
	</head>
	<body>
		<h2>Factorial of a Number</h2>
		<script>
			let num = parseInt(prompt("Enter a number:"));
			let fact = 1;
			for (let i = 1; i <= num; i++) {
				fact *= i;
			}
			document.write("Factorial of " + num + " is: " + fact); // Show result
		</script>
	</body>
</html>
