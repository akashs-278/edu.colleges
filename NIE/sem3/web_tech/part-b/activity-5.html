<!DOCTYPE html>
<html>
<head>
    <title>Mouse Over and Mouse Out Example</title>

    <script>
        function changeFont() {
            document.getElementById("para").style.fontFamily = "Arial";
            document.getElementById("para").style.fontSize = "24px";
            document.getElementById("para").style.fontStyle = "italic";
            document.getElementById("para").style.color = "blue";
        }

        function restoreFont() {
            document.getElementById("para").style.fontFamily = "Times New Roman";
            document.getElementById("para").style.fontSize = "18px";
            document.getElementById("para").style.fontStyle = "normal";
            document.getElementById("para").style.color = "black";
        }
    </script>
</head>

<body>

    <h2>JavaScript Mouse Over and Mouse Out</h2>

    <p id="para"
       onmouseover="changeFont()"
       onmouseout="restoreFont()">
        Move the mouse over this paragraph to change its font style.
    </p>

</body>
</html>
